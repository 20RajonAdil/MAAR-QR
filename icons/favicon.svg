<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0A1F1A"/>
  <!-- QR finder pattern, top-left -->
  <g>
    <rect x="6" y="6" width="16" height="16" rx="3" fill="none" stroke="#C9A24B" stroke-width="3"/>
    <rect x="11" y="11" width="6" height="6" rx="1" fill="#C9A24B"/>
  </g>
  <!-- QR finder pattern, top-right -->
  <g>
    <rect x="42" y="6" width="16" height="16" rx="3" fill="none" stroke="#3FA588" stroke-width="3"/>
    <rect x="47" y="11" width="6" height="6" rx="1" fill="#3FA588"/>
  </g>
  <!-- QR finder pattern, bottom-left -->
  <g>
    <rect x="6" y="42" width="16" height="16" rx="3" fill="none" stroke="#3FA588" stroke-width="3"/>
    <rect x="11" y="47" width="6" height="6" rx="1" fill="#3FA588"/>
  </g>
  <!-- M glyph built from modules, bottom-right quadrant -->
  <g fill="#EAF3EF">
    <rect x="42" y="42" width="4" height="4"/>
    <rect x="42" y="48" width="4" height="4"/>
    <rect x="42" y="54" width="4" height="4"/>
    <rect x="48" y="48" width="4" height="4"/>
    <rect x="54" y="42" width="4" height="4"/>
    <rect x="54" y="48" width="4" height="4"/>
    <rect x="54" y="54" width="4" height="4"/>
  </g>
</svg>
